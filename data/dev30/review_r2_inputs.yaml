# 機械欄位（句子、字數、readings、field_determinable）一律從 sentences.yaml 取，
# 不寫在這裡。這個檔只放三方複核者的意見、助理的整併建議，以及準則層決策草案。
# 這樣 REVIEW.md 裡每一句話的來源都可以追：
#   - 事實欄位 → sentences.yaml
#   - 第一輪 verdict → sentences.yaml 的 review_r1
#   - grok / gpt / claude → 本檔 items.*.reviews（研究者貼入的三份複核，摘錄）
#   - 合議建議 → 本檔 items.*.consensus（**助理的判斷**，需研究者確認才算數）

