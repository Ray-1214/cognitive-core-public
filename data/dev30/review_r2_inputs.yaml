        note: 消歧句「此人難以評斷」還能讀成「此人難以評斷別人」；兩個 spurious 荒謬到沒有鑑別力；質疑 licensed 2 在台灣華語是否可得。
    consensus:
      v: fix
      note: |
        你在檔案裡已經對 spurious 1 表態，方向與 claude 一致 —— 依 D2 兩條 spurious 都刪。
        消歧句另有主／賓兩讀（誰評斷誰），候選：「這個人不好評價」（6 字，+0，語域不變）。
        licensed 2 是否成立看 Q4。本句已在污染清單內，見 D7。
  dev-lex-02:
    links: [D2, D6]
    ask: [Q11]
    reviews:
      grok:
        v: keep
        note: 三讀（釋懷、物理放下、卸職）皆合理且互不相容。
      gpt:
        v: keep
        note: 三讀成立；「卸下職務」稍偏語境化，可改寫成「放下這份工作／責任」。
      claude:
        v: fix
        note: spurious 1 在安寧療護／佛教語境可作「安詳離世」的委婉語，不乾淨；三讀靠零形賓語，其實接近 REFERENTIAL。
    consensus:
      v: fix
