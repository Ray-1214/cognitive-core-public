<text x='676' y='281' font-size='12' font-weight='normal' fill='#663' text-anchor='start' font-family='Microsoft JhengHei, sans-serif'>95% CI 全數涵蓋 0.5。</text>
<text x='676' y='298' font-size='12' font-weight='normal' fill='#663' text-anchor='start' font-family='Microsoft JhengHei, sans-serif'></text>
<text x='676' y='315' font-size='12' font-weight='normal' fill='#663' text-anchor='start' font-family='Microsoft JhengHei, sans-serif'>→ 無法預測哪些題目需要驗證，</text>
<text x='676' y='332' font-size='12' font-weight='normal' fill='#663' text-anchor='start' font-family='Microsoft JhengHei, sans-serif'>　 任何分流都不優於隨機。</text>
<text x='676' y='349' font-size='12' font-weight='normal' fill='#663' text-anchor='start' font-family='Microsoft JhengHei, sans-serif'>　 故本系統走單一路徑。</text>
<text x='490' y='702' font-size='11' font-weight='normal' fill='#888' text-anchor='middle' font-family='Microsoft JhengHei, sans-serif'>取消 P5／P6 的決定與理由見技術報告 §5.1；AUC 完整結果見 figs/auc_summary.png</text>
